<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tu Nombre — Desarrollador Web Freelance</title>

  <!-- Estos textos son los que aparecen al compartir el link en WhatsApp, LinkedIn, etc. -->
  <meta name="description" content="Portafolio de Tu Nombre: proyectos, experiencia y contacto.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Tu Nombre — Desarrollador Web Freelance">
  <meta property="og:description" content="Portafolio de Tu Nombre: proyectos, experiencia y contacto.">
  <meta property="og:image" content="assets/preview.png">
  <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232563eb'/></svg>">

  <!-- Aplica el tema guardado antes de pintar, para evitar parpadeos -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap top__inner">
      <a class="brand" href="#inicio" id="brand"></a>
      <nav class="nav" aria-label="Principal">
        <a href="#proyectos" data-section="projects">Proyectos</a>
        <a href="#experiencia" data-section="experience">Experiencia</a>
        <a href="#contacto">Contacto</a>
      </nav>
      <button class="theme" id="theme" type="button" aria-label="Cambiar entre modo claro y oscuro">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="hero wrap" id="inicio">
      <p class="status" id="status" hidden><span class="dot"></span>Disponible para nuevos proyectos</p>
      <h1 id="hero-name"></h1>
      <p class="role" id="hero-role"></p>
      <p class="lead" id="hero-tagline"></p>
      <div class="actions">
        <a class="btn btn--primary" id="cta-contact" href="#contacto">Contáctame</a>
        <a class="btn" id="cta-cv" href="#" download hidden>Descargar CV</a>
      </div>
    </section>

    <section class="wrap block" id="sobre-mi">
      <h2>Sobre mí</h2>
      <p class="bio" id="bio"></p>
      <ul class="chips" id="skills"></ul>
    </section>

    <section class="wrap block" id="servicios" hidden>
      <h2>Servicios</h2>
      <div class="services" id="services"></div>
    </section>

    <section class="wrap block" id="proyectos" hidden>
      <h2>Proyectos</h2>
      <div class="grid" id="projects"></div>
    </section>

    <section class="wrap block" id="experiencia" hidden>
      <h2>Experiencia</h2>
      <ol class="timeline" id="experience"></ol>
      <div id="education-wrap" hidden>
        <h3>Educación</h3>
        <ol class="timeline" id="education"></ol>
      </div>
    </section>

    <section class="wrap block contact" id="contacto">
      <h2>Trabajemos juntos</h2>
      <p class="lead">¿Tienes un proyecto en mente? Escríbeme y te respondo pronto.</p>
      <a class="mail" id="mail" href="#"></a>
      <ul class="links" id="links"></ul>
    </section>
  </main>

  <footer class="wrap foot">
    <span id="foot"></span>
  </footer>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
